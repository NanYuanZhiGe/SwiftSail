name: CICD backend SwiftSail

on:
  push:
    branches: [ "backend" ]
jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: clone files
        uses: actions/checkout@v4

      - name: Maven clean and build user
        working-directory: ./backend/SwiftSail
        run: mvn clean package -pl user -am

      - name: stop last
        run: sudo systemctl stop swiftsail.user.service

      - name: Wait for process to exit
        run: timeout 10s bash -c 'while pgrep -f user-0.0.1-SNAPSHOT\.jar > /dev/null; do sleep 1; done' || true

      - name: remove last
        run: rm -rf /usr/swiftsail/target/user-0.0.1-SNAPSHOT.jar

      - name: move target
        working-directory: ./backend/SwiftSail
        run: mv user/target/user-0.0.1-SNAPSHOT.jar /usr/swiftsail/target/

      - name: reload SwiftSail.user service
        run: sudo -n systemctl daemon-reload

      - name: restart SwiftSail.user service
        run: sudo -n systemctl restart swiftsail.user.service
