name: CICD backend SwiftSail

on:
  push:
    branches: [ "backend" ]
jobs:
  deploy:
    runs-on: self-hosted
    env:
      MODULE_NAME: geo
    steps:
      - name: show java version
        run: java --version

      - name: set https proxy
        run: git config --global https.proxy http://127.0.0.1:7890

      - name: set http proxy
        run: git config --global http.proxy http://127.0.0.1:7890

      - name: clone files
        uses: actions/checkout@v4

      - name: Maven clean and build ${{ env.MODULE_NAME }}
        working-directory: ./backend/SwiftSail
        run: mvn clean package -pl ${{ env.MODULE_NAME }} -am

      - name: stop last
        run: sudo systemctl stop swiftsail.${{ env.MODULE_NAME }}.service

      - name: Wait for process to exit
        run: timeout 10s bash -c 'while pgrep -f ${{ env.MODULE_NAME }}-0.0.1-SNAPSHOT\.jar > /dev/null; do sleep 1; done' || true

      - name: remove last
        run: rm -rf /usr/swiftsail/target/${{ env.MODULE_NAME }}-0.0.1-SNAPSHOT.jar

      - name: move target
        working-directory: ./backend/SwiftSail
        run: mv ${{ env.MODULE_NAME }}/target/${{ env.MODULE_NAME }}-0.0.1-SNAPSHOT.jar /usr/swiftsail/target/

      - name: reload SwiftSail.${{ env.MODULE_NAME }} service
        run: sudo -n systemctl daemon-reload

      - name: restart SwiftSail.${{ env.MODULE_NAME }} service
        run: sudo -n systemctl restart swiftsail.${{ env.MODULE_NAME }}.service
