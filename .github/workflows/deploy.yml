name: CICD backend SwiftSail

on:
  push:
    branches: [ "backend" ]
jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: clone files
        uses: actions/checkout@v4

      - name: Maven clean and build dock
        working-directory: ./backend/SwiftSail
        run: mvn clean package -pl dock -am

      - name: stop last
        run: sudo systemctl stop swiftsail.dock.service

      - name: Wait for process to exit
        run: timeout 10s bash -c 'while pgrep -f dock-0.0.1-SNAPSHOT\.jar > /dev/null; do sleep 1; done' || true

      - name: remove last
        run: rm -rf /usr/swiftsail/target/dock-0.0.1-SNAPSHOT.jar

      - name: move target
        working-directory: ./backend/SwiftSail
        run: mv dock/target/dock-0.0.1-SNAPSHOT.jar /usr/swiftsail/target/

      - name: reload SwiftSail.dock service
        run: sudo -n systemctl daemon-reload

      - name: restart SwiftSail.dock service
        run: sudo -n systemctl restart swiftsail.dock.service
